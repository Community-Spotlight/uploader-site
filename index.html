<html lang="en">
  <head>
    <title>Community Spotlight Uploader</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta content="Community Spotlight Uploader" property="og:title" />
    <meta
      content="Upload Promotional Media for Community Spotlight, Free of Charge!"
      property="og:description"
    />
    <meta
      content="https://community-spotlight.github.io/uploader-site/"
      property="og:url"
    />
    <meta
      content="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/CS-logo.png"
      property="og:image"
    />
    <meta content="#00ff84" data-react-helmet="true" name="theme-color" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/CS-upload.svg"
    />
    <base href="/uploader-site/">
    <link rel="stylesheet" href="./styles/panel.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Tilt+Warp"
    />
  </head>
  <body>
    <div class="nav-header">
      <div class="inner-nav">
        <a class="home-page-nav" href="https://community-spotlight.github.io/">
          <img
            draggable="false"
            src="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/CS-logo.svg"
          />
        </a>
        <div class="nav-title">Community Spotlight Promotion Uploader</div>
      </div>
    </div>
    <div class="promo-uploader">
      <div class="upload-section">
        <div class="section-inner" id="meta">
          <span class="section-title">Name of Product</span>
          <v-input
            class="product-name"
            type="text"
            min="3"
            max="50"
            placeholder="My Product"
            required
          ></v-input>
          <span class="section-title">URL to Product</span>
          <v-input
            class="product-url"
            type="text"
            placeholder="https://example.com"
            pattern="^https://.+"
            required
          ></v-input>
          <div class="warn-box">
            <svg
              width="800"
              height="800"
              viewBox="0 0 1024 1024"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="red"
                d="M928.99 755.83 574.6 203.25c-12.89-20.16-36.76-32.58-62.6-32.58s-49.71 12.43-62.6 32.58L95.01 755.83c-12.91 20.12-12.9 44.91.01 65.03 12.92 20.12 36.78 32.51 62.59 32.49h708.78c25.82.01 49.68-12.37 62.59-32.49s12.92-44.91.01-65.03M554.67 768h-85.33v-85.33h85.33zm0-426.67v298.66h-85.33V341.32z"
              />
            </svg>
            <span id="warn-alert-msg">XXX</span>
          </div>
        </div>
      </div>
      <div class="upload-section" id="tags">
        <div class="section-inner">
          <span class="section-title">Related Tags and Topics</span>
          <i class="desc">Select what seems best fit for your Promotion</i>
          <div class="tag-div">
            <div class="promo-tag">
              <input type="checkbox" id="XXX" />
              <label class="btn-light" for="XXX">
                <span>XXX</span>
              </label>
            </div>
          </div>
          <img
            id="more-tags"
            draggable="false"
            title="Expand/Contract Tag List"
            src="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/arrow-right.svg"
          />
        </div>
      </div>
      <div class="upload-section">
        <div class="section-inner" id="media">
          <span class="section-title">Promotional Media</span>
          <div class="media-ctrl">
            <div class="media-item">
              <img
                class="media-nav btn-light remove"
                src="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/minus.svg"
                draggable="false"
              />
              <div class="media-upload btn-light">Upload Media</div>
              <input type="file" id="file-input" />
              <img
                class="media-nav btn-light add"
                src="https://cdn.jsdelivr.net/gh/Community-Spotlight/assets/plus.svg"
                draggable="false"
              />
            </div>
          </div>
          <div class="btn" id="guidelines">Media Guidelines</div>
        </div>
      </div>
      <div class="upload-section">
        <div class="section-inner" id="optNotif">
          <span class="section-title">Discord User ID (Optional)</span>
          <i class="desc">
            You will receive a notification from our server when your Promotion
            is reviewed
          </i>
          <v-input
            class="promoter-id"
            type="number"
            min="10000000000000000"
            max="999999999999999999999999"
            dontErrorClamp
          ></v-input>
        </div>
      </div>
      <button id="submit-promo" class="btn submit">Upload Promotion</button>
    </div>
    <script src="./components/input.js"></script>
    <script src="./scripts/Events.js"></script>
    <script src="./scripts/gui.js" type="module"></script>
    <script src="./scripts/uploader.js" type="module"></script>
  </body>
</html>
